name: Weather Context verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'weather_context.py'
      - 'app.py'
      - 'tests/test_weather_context.py'
      - '.github/workflows/weather-context-verification.yml'
  workflow_dispatch:

jobs:
  weather-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install weather test dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Check Python syntax
        run: python -m py_compile app.py weather_context.py tests/test_weather_context.py
      - name: Verify weather behavior without provider calls
        run: python -m unittest discover -s tests -p 'test_weather_context.py' -v
