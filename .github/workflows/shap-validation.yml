name: CropCast SHAP verification

on:
  pull_request:
    paths:
      - 'app.py'
      - 'explainability.py'
      - 'sensitivity.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/shap-validation.yml'
  workflow_dispatch:

jobs:
  explainability-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q app.py explainability.py tests/
      - name: Run explanation and sensitivity unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download trusted release model
        run: |
          curl --fail --location --retry 2 --output model-b.joblib \
            https://github.com/Kxni5hk/crop-yield-predictor/releases/download/v1.0.1/crop_yield_model_b_for_release.joblib
      - name: Test SHA256-verified actual Model B explanations
        run: PYTHONPATH=. python tests/test_release_model.py model-b.joblib
